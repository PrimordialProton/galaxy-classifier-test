name: Fetch and classify new JWST images

on:
  schedule:
    # Runs once a day at 06:00 UTC. Adjust as you like - MAST doesn't
    # release new public data constantly, so daily is a reasonable cadence.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "How many days back to search MAST for new observations"
        required: false
        default: "30"
      max_new:
        description: "Max number of new observations to fetch/classify this run"
        required: false
        default: "10"

permissions:
  contents: write  # needed so this workflow can push its own commits back

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install torch (CPU-only build)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install remaining dependencies
        run: |
          pip install astroquery pillow requests

      - name: Run fetch + classify
        run: |
          cd classifier-pipeline
          python -u fetch_and_classify.py \
            --max_new "${{ github.event.inputs.max_new || '10' }}" \
            --lookback_days "${{ github.event.inputs.lookback_days || '30' }}"

      - name: Commit updated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/jwst_results.json data/thumbnails classifier-pipeline/manifest.json
          git diff --staged --quiet || git commit -m "Auto-update: new classified JWST images"
          git push
